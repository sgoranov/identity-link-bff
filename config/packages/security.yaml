security:
    providers:
      app_user_provider:
        id: App\Security\OidcUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
          pattern: ^/
          lazy: true
          provider: app_user_provider
          entry_point: App\Security\OidcAuthenticationEntryPoint

          oidc:
            client: default
            login_path: /login
            check_path: /login_check
            default_target_path: /post-login
            always_use_default_target_path: true
            # Use ID token claims as user data (your ID token includes name/given_name/family_name).
            # This avoids relying on the UserInfo endpoint returning these fields.
            enable_retrieve_user_info: false
            user_info_from_idtoken: true
            user_identifier_from_idtoken: true

          logout:
            path: /logout
            target: /login

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
      - { path: ^/login, roles: PUBLIC_ACCESS }
      - { path: ^/post-login, roles: ROLE_USER }
      - { path: ^/logout, roles: ROLE_USER }
      - { path: ^/session, roles: ROLE_USER }
      - { path: ^/proxy, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
