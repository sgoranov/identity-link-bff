security:
    providers:
      app_user_provider:
        id: App\Security\OidcUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
          pattern: ^/
          lazy: true
          provider: app_user_provider
          entry_point: App\Security\OidcAuthenticationEntryPoint

          oidc:
            client: default
            login_path: /login
            check_path: /login_check
            default_target_path: /post-login
            always_use_default_target_path: true
            # Use ID token claims as user data (your ID token includes name/given_name/family_name).
            # This avoids relying on the UserInfo endpoint returning these fields.
            enable_retrieve_user_info: false
            user_info_from_idtoken: true
            user_identifier_from_idtoken: true

          logout:
            path: /logout
            target: '%env(POST_LOGOUT_REDIRECT_URL)%'

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
      - { path: ^/login, roles: PUBLIC_ACCESS }
      - { path: ^/post-login, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/logout, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/session, roles: IS_AUTHENTICATED_FULLY }
      - { path: ^/proxy, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
